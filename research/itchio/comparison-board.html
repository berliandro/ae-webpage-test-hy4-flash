<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itch.io pixel-art candidates — comparison board</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0d0c10; color: #e7d6b4; font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; }
  header { padding: 24px 28px; border-bottom: 1px solid #2a2530; }
  h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: .02em; }
  header p { margin: 0; color: #b9a47e; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; padding: 24px 28px 60px; }
  figure { margin: 0; background: #16131b; border: 1px solid #2a2530; padding: 12px; }
  figure.ref { border-color: #e25656; grid-column: 1 / -1; }
  .frame { height: 240px; display: grid; place-items: center; background: #100e14; overflow: hidden; }
  img { max-width: 100%; max-height: 100%; image-rendering: pixelated; object-fit: contain; }
  figcaption { padding-top: 10px; }
  .name { font-weight: 700; font-size: 15px; }
  .meta { color: #b9a47e; font-size: 12px; margin-top: 3px; }
  .verdict { margin-top: 8px; display: inline-block; padding: 2px 8px; border: 1px solid currentColor; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .keep { color: #8fd694; } .maybe { color: #e2be80; } .reject { color: #e25656; }
  a { color: #e2be80; }
</style>
</head>
<body>
<header>
  <h1>Itch.io pixel-art candidates — comparison board</h1>
  <p>Reference first (red border), then shortlisted candidates. Images hotlinked from itch.io for evaluation only. View with internet access.</p>
</header>
<div class="grid">

      <div class="meta">Fine 1-pixel marks, hard 2–4px outlines, warm-amber centre / cool-charcoal edges, muted teal felt, crimson + cream accents. Drawn at final resolution — not an upscaled low-res grid.</div></figcaption>
  </figure>

</body>
