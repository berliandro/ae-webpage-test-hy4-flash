<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="study.css">
<style>
.bg{filter:blur(9px) brightness(0.32) saturate(0.6);background-position:center 30%}
.hand-photo{height:38%;filter:blur(3px) brightness(.5)}
.fan{bottom:12%}
.wordmark{top:7%;font-size:10px;letter-spacing:.45em}
.card{border-radius:9px;box-shadow:0 2px 2px rgba(0,0,0,.5),0 12px 22px rgba(0,0,0,.6),inset 0 0 0 3px rgba(255,255,255,.3),inset 0 0 0 5px rgba(120,86,36,.4)}
.card::before{inset:6px}
.corner{top:9px;left:10px;font-size:12px}.corner-tr{right:10px}
.portrait{left:10px;right:10px;top:26px;bottom:36px}
.name{font-size:10px;bottom:11px}
.note{font-size:8px;left:5%}
</style></head><body>
<div class="scene">
  <div class="bg"></div><div class="hand-photo"></div><div class="grip left"></div><div class="grip right"></div><div class="pool"></div><div class="vignette"></div>
  <div class="wordmark">Alter Ego</div>
  <div class="fan">
    <div class="card" style="--cw:124px;--ch:190px;--x:-130px;--dy:16px;--rot:-16deg"><div class="corner">&#10022;</div><div class="corner corner-tr">&#10022;</div><div class="portrait"></div><div class="name">Nino</div></div>
    <div class="card" style="--cw:124px;--ch:190px;--x:-65px;--dy:6px;--rot:-8deg"><div class="corner">&#10022;</div><div class="corner corner-tr">&#10022;</div><div class="portrait"></div><div class="name">Affan</div></div>
    <div class="card" style="--cw:124px;--ch:190px;--x:0px;--dy:0px;--rot:0deg"><div class="corner">&#10022;</div><div class="corner corner-tr">&#10022;</div><div class="portrait"></div><div class="name">Dalvin</div></div>
    <div class="card" style="--cw:124px;--ch:190px;--x:65px;--dy:6px;--rot:8deg"><div class="corner">&#10022;</div><div class="corner corner-tr">&#10022;</div><div class="portrait"></div><div class="name">Dingarai</div></div>
    <div class="card" style="--cw:124px;--ch:190px;--x:130px;--dy:16px;--rot:16deg"><div class="corner">&#10022;</div><div class="corner corner-tr">&#10022;</div><div class="portrait"></div><div class="name">Alexander</div></div>
  </div>
  <div class="note">Mobile &middot; 390 &times; 844</div>
</div></body></html>
